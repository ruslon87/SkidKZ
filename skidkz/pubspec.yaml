name: skidkz
description: "SkidKZ MVP prototype (role-based app: buyer / wanghong / seller / admin)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI / core
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  state_notifier: ^1.0.0
  go_router: ^17.0.1
  google_fonts: ^7.1.0
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  uuid: ^4.5.2
  equatable: ^2.0.8
  gap: ^3.0.1

  # Firebase (backend: auth + firestore + messaging)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0

  # App info (версия/билд)
  package_info_plus: ^8.0.0

  # Sharing
  share_plus: ^10.0.0

  # GEO (город по геопозиции)
  geolocator: ^11.0.0
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
